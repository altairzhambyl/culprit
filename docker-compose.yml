# One-command self-hosting for the Culprit dashboard:
#
#   docker compose up -d --build       # http://127.0.0.1:8000 — works with zero credentials
#
# Requires Docker Engine >= 24 and Docker Compose v2 (verified with Engine 29.1.3 / Compose v2.39.1).
#
# Defaults are deliberately safe: the offline `scripted` provider (no API keys, no cloud calls)
# and a loopback-only port publish. Read docs/self-hosting.md#security BEFORE changing either.
#
# A `.env` file next to this one is read by Compose and substituted into the `${...}` values below.
# Put ONLY credentials and the settings listed here in it — do NOT copy `.env.example` over it:
# that file configures a bare-metal host and sets CULPRIT_HOST=127.0.0.1, which is wrong inside a
# container. The three container-internal settings (CULPRIT_HOST, CULPRIT_PORT, CULPRIT_RUNS_DIR)
# are pinned below precisely so that nothing in a `.env` can unbind or relocate the server.

services:
  culprit:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: culprit-dashboard:local
    # Overridable so the stack can run alongside another container called "culprit".
    container_name: ${CULPRIT_CONTAINER_NAME:-culprit}
    # Loopback-only by default. CULPRIT_HOST_PORT changes the host port (use it when 8000 is taken);
    # CULPRIT_BIND_ADDRESS changes the host interface. To expose the dashboard on the LAN/internet set
    # CULPRIT_BIND_ADDRESS=0.0.0.0 *and* CULPRIT_API_TOKEN + CULPRIT_DEMO_ONLY=true (see SECURITY).
    ports:
      - "${CULPRIT_BIND_ADDRESS:-127.0.0.1}:${CULPRIT_HOST_PORT:-8000}:8000"

    environment:
      # --- container-internal, pinned on purpose (do not parameterise) ---------------------
      # The server must bind all interfaces *inside* the container; exposure is controlled by
      # the publish address above. CULPRIT_RUNS_DIR must stay on the mounted volume.
      - CULPRIT_HOST=0.0.0.0
      - CULPRIT_PORT=8000
      - CULPRIT_RUNS_DIR=/data/runs

      # --- model provider -----------------------------------------------------------------
      # scripted = deterministic offline model; the churn demo runs end to end with no keys.
      # Switch to bedrock | anthropic | openai and supply the matching credentials below.
      # (anthropic/openai also need their pip extra — see docs/self-hosting.md.)
      - CULPRIT_MODEL_PROVIDER=${CULPRIT_MODEL_PROVIDER:-scripted}
      - CULPRIT_MODEL_ID=${CULPRIT_MODEL_ID:-}
      - CULPRIT_MODEL_TEMPERATURE=${CULPRIT_MODEL_TEMPERATURE:-0.2}
      - CULPRIT_MODEL_MAX_TOKENS=${CULPRIT_MODEL_MAX_TOKENS:-4096}

      # --- security (read docs/self-hosting.md#security) ----------------------------------
      # CULPRIT_API_TOKEN: bearer token required on the three mutating POST endpoints
      # (/api/demo/init, /api/runs, /api/runs/{id}/respond). It does NOT protect any GET
      # endpoint — the run list, SSE stream, reports, PR bodies and traces stay public.
      - CULPRIT_API_TOKEN=${CULPRIT_API_TOKEN:-}
      # CULPRIT_DEMO_ONLY=true restricts POST /api/runs to the two bundled demo repositories.
      # Without it, anyone who can POST /api/runs can make Culprit execute the
      # `experiment_command` of any repo path/URL they name — i.e. arbitrary shell commands.
      # It is a scope limit, not a sandbox: the agent still writes files and runs the demo
      # project's test command inside the container. The container IS the boundary.
      - CULPRIT_DEMO_ONLY=${CULPRIT_DEMO_ONLY:-false}

      # --- guard-rails (defaults shown; see the table in docs/self-hosting.md) -------------
      - CULPRIT_MAX_EXPERIMENTS=${CULPRIT_MAX_EXPERIMENTS:-10}
      - CULPRIT_EXPERIMENT_TIMEOUT=${CULPRIT_EXPERIMENT_TIMEOUT:-600}
      - CULPRIT_MAX_TOOL_CALLS=${CULPRIT_MAX_TOOL_CALLS:-60}
      - CULPRIT_MAX_REPEATED_CALLS=${CULPRIT_MAX_REPEATED_CALLS:-3}
      - CULPRIT_APPROVAL_TOOLS=${CULPRIT_APPROVAL_TOOLS:-open_pull_request}
      - CULPRIT_AUTO_APPROVE=${CULPRIT_AUTO_APPROVE:-false}

      # --- credentials and integrations ----------------------------------------------------
      # Bare names: taken from your shell environment or from `.env`, and passed through only
      # when they are actually set, so boto3 never sees an empty AWS_PROFILE. Without
      # GitHub/Slack, the pull request and the notification are written into the run directory.
      - AWS_REGION
      - AWS_DEFAULT_REGION
      - AWS_PROFILE
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GITHUB_TOKEN
      - GITHUB_REPO
      - GITHUB_API_URL
      - SLACK_WEBHOOK_URL

    volumes:
      # /data is the container's working directory AND its state directory. It holds
      #   /data/runs           run records, events.jsonl, traces, sessions, reports, fix worktrees
      #   /data/demo/*         demo repositories generated by the dashboard's "build demo" button
      - culprit-data:/data
      # Investigating your own repository? Mount it read-write and point the dashboard at the
      # container path. It must be writable by the container user (uid 10001) — see
      # docs/self-hosting.md#3-investigating-your-own-repository.
      # - /srv/ml/churn-model:/repos/churn-model
      # Using an AWS profile instead of keys? Mount your credentials read-only and set AWS_PROFILE.
      # - ${HOME}/.aws:/home/culprit/.aws:ro

    restart: unless-stopped

    # Exactly one Culprit process may use a runs directory at a time: a second RunManager on the
    # same /data marks every in-flight run as failed at startup. Do not `--scale` this service,
    # and do not run `culprit` CLI commands in the container while an investigation is running.

volumes:
  culprit-data:
    # Pinned (not project-prefixed) so the backup/restore commands in docs/self-hosting.md
    # address the same volume whether you came in via compose or via plain `docker run`.
    name: culprit-data
